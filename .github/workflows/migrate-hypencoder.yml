name: Migrate Qdrant to Hypencoder

on:
  workflow_dispatch:
    inputs:
      chunk_limit:
        description: "Number of points to migrate in this run (e.g. 'all', 25000, 50000)"
        required: false
        default: "all"
      chunk_size:
        description: "Number of chunks per streaming batch (default: 2500)"
        required: false
        default: "2500"
      batch_size:
        description: "Batch size for passage encoding (default: 16)"
        required: false
        default: "16"

permissions:
  contents: read

concurrency:
  group: hypencoder-qdrant-migration
  cancel-in-progress: false

jobs:
  migration_status:
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.check.outputs.complete }}
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_HYPENCODER: document_chunks_hypencoder
    steps:
      - name: Check out migration code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qdrant client
        run: python -m pip install "qdrant-client>=1.15,<1.17" python-dotenv

      - name: Check whether Hypencoder migration is complete
        id: check
        shell: bash
        run: |
          set -euo pipefail
          migration_status="$(python check_hypencoder_status.py)"
          echo "complete=$migration_status" >> "$GITHUB_OUTPUT"
          echo "Hypencoder collection complete: $migration_status"

  migrate:
    needs: migration_status
    if: needs.migration_status.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_HYPENCODER: document_chunks_hypencoder
      HF_HOME: ${{ github.workspace }}/.hf_cache

    steps:
      - name: Check out migration code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore Hugging Face Cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hypencoder-hf-ubuntu-x64-v1
          restore-keys: |
            hypencoder-hf-ubuntu-x64-

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0" "transformers>=4.48" "sentence-transformers>=6.1.0" "qdrant-client>=1.15,<1.17" python-dotenv tqdm numpy

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QDRANT_URL" ]] || { echo "QDRANT_URL secret is required" >&2; exit 1; }
          [[ "$QDRANT_COLLECTION" != "$QDRANT_COLLECTION_HYPENCODER" ]] || { echo "Source and destination collections must differ" >&2; exit 1; }

      - name: Run Hypencoder migration
        shell: bash
        env:
          CHUNK_LIMIT: ${{ inputs.chunk_limit || 'all' }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '2500' }}
          BATCH_SIZE: ${{ inputs.batch_size || '16' }}
        run: |
          set -euo pipefail
          ARGS=("--resume" "--chunk-size" "$CHUNK_SIZE" "--batch-size" "$BATCH_SIZE")
          if [[ "$CHUNK_LIMIT" != "all" && -n "$CHUNK_LIMIT" ]]; then
            ARGS+=("--limit" "$CHUNK_LIMIT")
          fi
          python migrate_hypencoder.py "${ARGS[@]}"

  resume_after_timeout:
    needs: migrate
    if: ${{ always() && needs.migrate.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_HYPENCODER: document_chunks_hypencoder
      HF_HOME: ${{ github.workspace }}/.hf_cache

    steps:
      - name: Check out migration code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore Hugging Face Cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hypencoder-hf-ubuntu-x64-v1
          restore-keys: |
            hypencoder-hf-ubuntu-x64-

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0" "transformers>=4.48" "sentence-transformers>=6.1.0" "qdrant-client>=1.15,<1.17" python-dotenv tqdm numpy

      - name: Resume Hypencoder migration
        shell: bash
        env:
          CHUNK_LIMIT: ${{ inputs.chunk_limit || 'all' }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '2500' }}
          BATCH_SIZE: ${{ inputs.batch_size || '16' }}
        run: |
          set -euo pipefail
          ARGS=("--resume" "--chunk-size" "$CHUNK_SIZE" "--batch-size" "$BATCH_SIZE")
          if [[ "$CHUNK_LIMIT" != "all" && -n "$CHUNK_LIMIT" ]]; then
            ARGS+=("--limit" "$CHUNK_LIMIT")
          fi
          python migrate_hypencoder.py "${ARGS[@]}"
