name: Benchmark Hypencoder vs Bi-Encoder

on:
  workflow_dispatch:
    inputs:
      chunk_limit:
        description: "Number of corpus chunks to migrate & evaluate"
        required: true
        default: "500"
      candidate_k:
        description: "Candidate pool size (K)"
        required: true
        default: "20"
      final_k:
        description: "Final reranked pool size (K)"
        required: true
        default: "5"

permissions:
  contents: read

concurrency:
  group: hypencoder-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_HYPENCODER: document_chunks_hypencoder
      HF_HOME: ${{ github.workspace }}/.hf_cache

    steps:
      - name: Check out benchmark code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore Hugging Face Cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hypencoder-hf-ubuntu-x64-v1
          restore-keys: |
            hypencoder-hf-ubuntu-x64-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0" "transformers>=4.48" "sentence-transformers>=6.1.0" "qdrant-client>=1.15,<1.17" python-dotenv tqdm numpy

      - name: Validate Qdrant secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QDRANT_URL" ]] || { echo "QDRANT_URL secret is required" >&2; exit 1; }

      - name: Migrate chunks & build neighbor graph for corpus
        run: |
          python migrate_hypencoder.py --limit ${{ inputs.chunk_limit }} --resume

      - name: Run end-to-end benchmark
        run: |
          python benchmark_hypencoder_large.py --candidate-k ${{ inputs.candidate_k }} --final-k ${{ inputs.final_k }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
