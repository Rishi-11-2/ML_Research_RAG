name: Benchmark Hypencoder vs Bi-Encoder

on:
  workflow_dispatch:
    inputs:
      query_count:
        description: "Number of distinct corpus-derived benchmark queries (minimum 10000)"
        required: true
        default: "10000"
      candidate_k:
        description: "Candidate pool size (K)"
        required: true
        default: "20"
      final_k:
        description: "Final reranked pool size (K)"
        required: true
        default: "5"
      entry_points:
        description: "Hypencoder graph starting points"
        type: number
        required: true
        default: 12
      expansion_candidates:
        description: "Hypencoder graph nodes expanded per iteration"
        type: number
        required: true
        default: 10
      max_iter:
        description: "Hypencoder graph traversal iterations"
        type: number
        required: true
        default: 4

permissions:
  contents: read

concurrency:
  group: hypencoder-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_HYPENCODER: document_chunks_hypencoder
      HF_HOME: ${{ github.workspace }}/.hf_cache

    steps:
      - name: Check out benchmark code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore Hugging Face Cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hypencoder-hf-ubuntu-x64-v1
          restore-keys: |
            hypencoder-hf-ubuntu-x64-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0" "transformers>=4.48" "sentence-transformers>=6.1.0" "qdrant-client>=1.15,<1.17" python-dotenv tqdm numpy

      - name: Validate Qdrant secret and query count
        shell: bash
        env:
          QUERY_COUNT: ${{ inputs.query_count }}
          ENTRY_POINTS: ${{ inputs.entry_points }}
          EXPANSION_CANDIDATES: ${{ inputs.expansion_candidates }}
          MAX_ITER: ${{ inputs.max_iter }}
        run: |
          set -euo pipefail
          [[ -n "$QDRANT_URL" ]] || { echo "QDRANT_URL secret is required" >&2; exit 1; }
          [[ "$QUERY_COUNT" =~ ^[0-9]+$ ]] || { echo "query_count must be an integer" >&2; exit 1; }
          (( QUERY_COUNT >= 10000 )) || { echo "query_count must be at least 10000" >&2; exit 1; }
          for value in "$ENTRY_POINTS" "$EXPANSION_CANDIDATES" "$MAX_ITER"; do
            [[ "$value" =~ ^[0-9]+$ ]] && (( value > 0 )) || { echo "traversal settings must be positive integers" >&2; exit 1; }
          done

      - name: Run end-to-end benchmark
        env:
          QUERY_COUNT: ${{ inputs.query_count }}
          CANDIDATE_K: ${{ inputs.candidate_k }}
          FINAL_K: ${{ inputs.final_k }}
          ENTRY_POINTS: ${{ inputs.entry_points }}
          EXPANSION_CANDIDATES: ${{ inputs.expansion_candidates }}
          MAX_ITER: ${{ inputs.max_iter }}
        run: |
          python benchmark_hypencoder_large.py \
            --query-count "$QUERY_COUNT" \
            --candidate-k "$CANDIDATE_K" \
            --final-k "$FINAL_K" \
            --entry-points "$ENTRY_POINTS" \
            --expansion-candidates "$EXPANSION_CANDIDATES" \
            --max-iter "$MAX_ITER"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
