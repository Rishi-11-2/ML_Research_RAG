name: Migrate Qdrant to EmbeddingGemma 2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

# Prevent separate workflow runs from writing the same destination concurrently.
concurrency:
  group: embeddinggemma2-qdrant-migration
  cancel-in-progress: false

jobs:
  migration_status:
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.check.outputs.complete }}
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_EG2: document_chunks_embeddinggemma2
    steps:
      - name: Check out migration code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qdrant client
        run: python -m pip install "qdrant-client>=1.15,<1.17"

      - name: Check whether migration is complete
        id: check
        shell: bash
        run: |
          set -euo pipefail
          status="$(python check_migration_status.py)"
          echo "complete=$status" >> "$GITHUB_OUTPUT"
          echo "EmbeddingGemma 2 collection complete: $status"

  migrate:
    needs: migration_status
    if: needs.migration_status.outputs.complete != 'true'
    # Standard GitHub-hosted Linux runner; avoids the paid macOS xlarge tier.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_EG2: document_chunks_embeddinggemma2
      HF_HOME: ${{ github.workspace }}/.hf_cache

    steps:
      - name: Check out migration code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore EmbeddingGemma 2 model cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: embeddinggemma2-hf-ubuntu-x64-v1

      - name: Create the migration virtual environment
        run: python -m venv ML_Research_RAG

      - name: Install migration dependencies
        run: |
          ./ML_Research_RAG/bin/python -m pip install --upgrade pip
          ./ML_Research_RAG/bin/python -m pip install "sentence-transformers>=6.1.0" "qdrant-client>=1.15,<1.17" python-dotenv numpy pillow torchvision

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QDRANT_URL" ]] || { echo "QDRANT_URL secret is required" >&2; exit 1; }
          [[ "$QDRANT_COLLECTION" != "$QDRANT_COLLECTION_EG2" ]] || { echo "Source and destination collections must differ" >&2; exit 1; }

      - name: Resume migration into the separate collection
        run: ./ML_Research_RAG/bin/python migrate_embeddinggemma2.py --resume

  resume_after_hosted_timeout:
    needs: migrate
    # Hosted jobs stop at six hours; continue safely from durable Qdrant point IDs.
    if: ${{ always() && needs.migrate.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: document_chunks
      QDRANT_COLLECTION_EG2: document_chunks_embeddinggemma2
      HF_HOME: ${{ github.workspace }}/.hf_cache
    steps:
      - name: Check out migration code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore EmbeddingGemma 2 model cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: embeddinggemma2-hf-ubuntu-x64-v1

      - name: Create the migration virtual environment
        run: python -m venv ML_Research_RAG

      - name: Install migration dependencies
        run: |
          ./ML_Research_RAG/bin/python -m pip install --upgrade pip
          ./ML_Research_RAG/bin/python -m pip install "sentence-transformers>=6.1.0" "qdrant-client>=1.15,<1.17" python-dotenv numpy pillow torchvision

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QDRANT_URL" ]] || { echo "QDRANT_URL secret is required" >&2; exit 1; }
          [[ "$QDRANT_COLLECTION" != "$QDRANT_COLLECTION_EG2" ]] || { echo "Source and destination collections must differ" >&2; exit 1; }

      - name: Resume migration into the separate collection
        run: ./ML_Research_RAG/bin/python migrate_embeddinggemma2.py --resume
